name: Update README source code

on:
  push:
    paths:
      - 'DSA_Prac/C_Practice/problem1/solution1.c'
      - 'DSA_Prac/C_Practice/problem1/README.md'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Insert source code into README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("DSA_Prac/C_Practice/problem1/README.md")
          source = Path("DSA_Prac/C_Practice/problem1/solution1.c")

          text = readme.read_text()
          code = source.read_text().rstrip()

          start = "<!-- SOURCE_CODE_START -->"
          end = "<!-- SOURCE_CODE_END -->"

          if start not in text or end not in text:
              raise SystemExit("README source markers are missing.")

          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)

          section = f"\n\n```c\n{code}\n```\n\n"
          updated = before + start + section + end + after

          if updated != text:
              readme.write_text(updated)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DSA_Prac/C_Practice/problem1/README.md
          git diff --cached --quiet || (
            git commit -m "docs: sync problem1 solution into README" &&
            git push
          )
